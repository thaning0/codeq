name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy, rust-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Install external analysis boundaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          npm install --global basedpyright@1.37.1 typescript@5.9.3 typescript-language-server@6.0.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Exercise real language-server boundaries
        run: cargo test --locked --bin codeq supported_real_language_servers_complete_document_symbol_round_trips -- --ignored
      - run: cargo build --locked --release
      - run: cargo package --locked --allow-dirty
