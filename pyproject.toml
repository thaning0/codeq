[project]
name = "codeq"
version = "0.4.0"
description = "Small CLI-first code intelligence for coding agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
codeq = "codeq.cli:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
