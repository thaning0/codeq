[project]
name = "codeq"
version = "1.0.0rc11"
description = "Small CLI-first code intelligence for coding agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
codeq = "codeq.cli:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.37.1,<2",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
